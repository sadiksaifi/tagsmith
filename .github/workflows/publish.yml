name: Publish

on:
  push:
    tags:
      - "v*"
      - "!v*-*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  validate:
    name: Validate release tag
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch refs
        run: git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Build CLI
        run: pnpm build

      - name: Validate release tag
        id: release
        run: node dist/cli.js validate --tag "$GITHUB_REF_NAME" --github-output

  npm:
    name: Publish to npm
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Set package version for publish
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: pnpm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Check npm package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish --registry https://registry.npmjs.org/ --access public --tag latest

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes "Published to npm as tagsmith@$RELEASE_VERSION with dist-tag latest."
