name: Publish

on:
  push:
    tags:
      - "v*"
      - "!v*-*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  validate:
    name: Validate release tag
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      release_notes: ${{ steps.notes.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch refs
        run: git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Build CLI
        run: pnpm build

      - name: Validate release tag
        id: release
        run: node dist/cli.js validate --tag "$GITHUB_REF_NAME" --github-output

      - name: Generate GitHub release notes
        id: notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --use-branch-tags --offline --no-exec
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md

      - name: Check generated release notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          NOTES_TAG: ${{ steps.notes.outputs.version }}
          RELEASE_NOTES: ${{ steps.notes.outputs.content }}
        run: |
          if [[ "$NOTES_TAG" != "$RELEASE_TAG" || -z "$RELEASE_NOTES" ]]; then
            printf 'Git Cliff did not generate release notes for %s (got %s).\n' "$RELEASE_TAG" "$NOTES_TAG" >&2
            exit 1
          fi

  npm:
    name: Publish to npm
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Set package version for publish
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: pnpm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Check npm package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish --registry https://registry.npmjs.org/ --access public --tag latest

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_NOTES: ${{ needs.validate.outputs.release_notes }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file - <<< "$RELEASE_NOTES"
