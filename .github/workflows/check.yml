name: Check

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  workflow_call:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup project
        uses: ./.github/actions/setup-project
      - name: Typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup project
        uses: ./.github/actions/setup-project
      - name: Lint pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git log --format='%h %s' "$BASE_SHA..$HEAD_SHA" |
            while read -r commit subject; do
              if [[ -z "$subject" ]]; then
                printf 'Commit %s has an empty message.\n' "$commit" >&2
                exit 1
              fi
            done
          pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Lint GitHub Actions workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec actionlint@1.7.12 -- actionlint
      - name: Lint
        run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup project
        uses: ./.github/actions/setup-project
      - name: Format check
        run: pnpm format:check

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup project
        uses: ./.github/actions/setup-project
      - name: Unit tests
        run: pnpm test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup project
        uses: ./.github/actions/setup-project
      - name: Integration tests
        run: pnpm test:integration

  coverage:
    name: Coverage
    needs: [unit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup project
        uses: ./.github/actions/setup-project
      - name: Coverage
        run: pnpm coverage

  e2e:
    name: E2E tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup project
        uses: ./.github/actions/setup-project
      - name: E2E tests
        run: pnpm test:e2e

  docs:
    name: Docs build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup project
        uses: ./.github/actions/setup-project
      - name: Build docs
        run: pnpm docs:build

  agent-skill:
    name: Agent Skill
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Agent Skills reference validator
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Validate Agent Skill
        run: skills-ref validate ./skills/tagsmith
